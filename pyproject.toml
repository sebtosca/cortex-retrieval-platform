[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex"
version = "0.1.0"
description = "Production-grade retrieval and intelligence platform"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sse-starlette>=2.1.0",

    # Async task queue
    "arq>=0.26.0",

    # Retrieval
    "qdrant-client>=1.9.0",
    "FlagEmbedding>=1.2.0",       # bge-m3
    "sentence-transformers>=3.0.0",  # cross-encoder reranker

    # LLM
    "anthropic>=0.28.0",
    "litellm>=1.40.0",

    # Data
    "yfinance>=0.2.40",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "redis[hiredis]>=5.0.0",

    # Document ingestion
    "pypdf>=4.2.0",
    "tiktoken>=0.7.0",

    # Observability
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",

    # Evaluation
    "ragas>=0.1.9",
    "datasets>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyyaml>=6.0",
]
benchmarks = [
    "locust>=2.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "configs", "embeddings", "evaluation", "financial", "ingestion", "llm", "retrieval", "observability"]

[tool.hatch.build.targets.editable]
packages = ["api", "configs", "embeddings", "evaluation", "financial", "ingestion", "llm", "retrieval", "observability"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
