version: "3.9"

# Shared config for api and worker — both build from the same image,
# load bge-m3 + cross-encoder, and need the same infra connections.
x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/Dockerfile.api
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-cortex_ai_initiatives}
    POSTGRES_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
    REDIS_URL: redis://redis:6379
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    OTEL_SERVICE_NAME: cortex-api
  volumes:
    - model_cache:/root/.cache   # shared bge-m3 + cross-encoder weights
  depends_on:
    qdrant:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    jaeger:
      condition: service_started
  restart: unless-stopped

services:

  # ── infrastructure ─────────────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cortex"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # ── application ────────────────────────────────────────────────────────────

  api:
    <<: *app-common
    ports:
      - "8000:8000"

  worker:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: arq api.worker.WorkerSettings

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  model_cache:
